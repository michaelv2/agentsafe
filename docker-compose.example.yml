services:
  agentsafe:
    build:
      context: .
      args:
        CLAUDE_UID: ${CLAUDE_UID:-1000}
        CLAUDE_GID: ${CLAUDE_GID:-1000}
    image: agentsafe:latest
    container_name: agentsafe
    hostname: agentsafe

    # --- GPU ---
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # --- Ports ---
    ports:
      - "2222:22"           # SSH access from external devices
      - "8000-8099:8000-8099"  # Web app serving range

    # --- Volumes ---
    volumes:
      # All projects visible as read-only by default
      - ~/projects:/workspace/projects:ro

      # Scratch space for the agent (temp files, experiments)
      - ./workspace:/workspace/scratch

      # Active development overrides (rw) — inner mounts take precedence
      # Use scripts/mount-project.sh to add/remove projects, or add manually:
      # - ~/projects/my-project:/workspace/projects/my-project
      # For git repos, also keep hooks and config read-only so the agent can't
      # plant code that runs when git is used on the host:
      # - ~/projects/my-project/.git/hooks:/workspace/projects/my-project/.git/hooks:ro
      # - ~/projects/my-project/.git/config:/workspace/projects/my-project/.git/config:ro

      # Claude OAuth credentials — mounted read-only to a staging path;
      # entrypoint copies to the writable location so CLI can refresh tokens
      - ./config/.credentials.json:/home/claude/.claude/.credentials-seed.json:ro

      # GitHub machine user credentials — read-only
      - ./config/git-credentials:/home/claude/.git-credentials:ro

      # SSH authorized keys for remote access — read-only
      - ./config/authorized_keys:/home/claude/.ssh/authorized_keys:ro

      # Hardened sshd config — read-only
      - ./config/sshd_config:/etc/ssh/sshd_config:ro

      # Claude CLI settings (permissions, hooks, statusline) — read-only
      - ./config/settings.json:/home/claude/.claude/settings.json:ro
      - ./config/statusline.sh:/home/claude/.claude/statusline.sh:ro
      # Host's global CLAUDE.md — keeps container preferences in sync with host
      - ~/.claude/CLAUDE.md:/home/claude/.claude/CLAUDE.md:ro

      # Codex CLI defaults (approval/sandbox/web search) — read-only
      - ./config/codex-config.toml:/home/claude/.codex/config.toml:ro

      # .aiexclude — read-only
      - ./config/.aiexclude:/home/claude/.claude/.aiexclude:ro

      # Per-project container virtualenvs (agentsafe-venv) — persist across rebuilds
      - ./data/venvs:/home/claude/venvs

      # Cortex memory — runtime (read-only) and shared data (read-write)
      # Requires claude-cortex-core to be cloned and built on the host
      # - ~/projects/claude-cortex-core:/opt/cortex:ro
      # - ~/.claude-cortex:/home/claude/.claude-cortex

    # --- Environment ---
    env_file:
      - ./config/.env
    environment:
      # NVIDIA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

      # Ollama host on LAN — use IP address, optional port (default 11434)
      # Example: 192.168.1.50 or 192.168.1.50:11434
      - OLLAMA_HOST=

      # Cortex memory path (matches volume mount, optional)
      # - CORTEX_PATH=/opt/cortex

      # Appearance
      - TERM=xterm-256color

      # Git identity for the machine user
      - GIT_AUTHOR_NAME=agentsafe-bot
      - GIT_AUTHOR_EMAIL=agentsafe-bot@users.noreply.github.com
      - GIT_COMMITTER_NAME=agentsafe-bot
      - GIT_COMMITTER_EMAIL=agentsafe-bot@users.noreply.github.com

    # --- Security ---
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # Fix ownership on mounted volumes
      - FOWNER         # chmod on files not owned by root
      - SETUID         # gosu to drop from root to claude
      - SETGID         # gosu to drop from root to claude
      - SYS_CHROOT     # sshd privilege separation
      - DAC_OVERRIDE   # sshd reading authorized_keys
      - AUDIT_WRITE    # sshd audit logging
      - NET_ADMIN      # iptables egress rules
      - NET_RAW        # iptables
      - KILL           # tini (root, PID 1) forwards signals to the claude-owned session;
                       # without it every forwarded signal is fatal ("[FATAL tini (1)]
                       # Unexpected error when forwarding signal") and the container exits
    # NOTE: no-new-privileges is omitted because sshd needs setuid on child
    # processes after authentication. Security is maintained via cap_drop ALL
    # with only specific capabilities added back.

    # --- Lifecycle ---
    restart: unless-stopped
    stdin_open: true
    tty: true

  # --- Vibe (Mistral) sessions --------------------------------------------------
  # One throwaway container per session, started by scripts/vibe.sh, which adds the
  # project mounts: all of ~/projects read-only, the named projects writable (their
  # .git/hooks and .git/config read-only), secret files and vibe/hide.txt paths empty.
  # Run it through vibe.sh, never `docker compose run vibe` directly, so the hiding
  # always comes with the mounts. Unlike the main container: no GPU, ports, SSH,
  # Claude/Codex/GitHub credentials, or LAN access except llm-server's Ollama.
  # It can commit but not push.
  # Vibe approves its own tool calls in here, since the container is the boundary.
  vibe:
    profiles: ["vibe"]
    image: agentsafe:latest
    hostname: agentsafe-vibe
    volumes:
      # Vibe's home: config.toml, AGENTS.md, .env (a Vibe-only Mistral key), sessions
      - ./data/vibe:/home/claude/.vibe
      # Per-project container virtualenvs (agentsafe-venv), kept between sessions
      - ./data/venvs:/home/claude/venvs
      # Your custom Vibe agents and skills (e.g. coder, todo-scout), read-only: edit them on the host
      - ~/.vibe/agents:/home/claude/.vibe/agents:ro
      - ~/.vibe/skills:/home/claude/.vibe/skills:ro
    environment:
      - AGENTSAFE_NO_SSHD=1
      # llm-server's Ollama is the one LAN address allowed (port 11434), for local subagents
      - OLLAMA_HOSTS=   # e.g. 192.168.1.50
      - GIT_TERMINAL_PROMPT=0   # a push fails at once instead of waiting for a login
      - TERM=xterm-256color
      - GIT_AUTHOR_NAME=agentsafe-bot
      - GIT_AUTHOR_EMAIL=agentsafe-bot@users.noreply.github.com
      - GIT_COMMITTER_NAME=agentsafe-bot
      - GIT_COMMITTER_EMAIL=agentsafe-bot@users.noreply.github.com
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # fix ownership on mounted volumes
      - FOWNER         # chmod on files not owned by root
      - SETUID         # gosu to drop from root to claude
      - SETGID         # gosu to drop from root to claude
      - DAC_OVERRIDE   # entrypoint writes into claude-owned directories as root
      - NET_ADMIN      # iptables egress rules
      - NET_RAW        # iptables
      - KILL           # tini (root, PID 1) forwards signals to the claude-owned session;
                       # without it every forwarded signal is fatal ("[FATAL tini (1)]
                       # Unexpected error when forwarding signal") and the container exits
    extra_hosts:
      # - "llm-server=192.168.1.50"   # if your config.toml uses a host name for Ollama
      # Vibe's built-in crash-report host (Sentry): telemetry is off in config.toml, but the
      # native launcher can't be inspected to confirm it honors that, so it resolves nowhere
      - "o4507101628137472.ingest.de.sentry.io:0.0.0.0"
      - "o4507101628137472.ingest.de.sentry.io=::"
    security_opt:
      - no-new-privileges:true   # no sshd here, so nothing needs setuid after the drop
    stdin_open: true
    tty: true
